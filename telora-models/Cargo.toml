[package]
name = "telora-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# voxora-hf is the source of truth for Hugging Face model resolution.
# telora-models is a thin wrapper that delegates to it; voxora
# (`voxora list / download`) is the recommended interface going
# forward and telora-models exists only for backwards compatibility.
#
# `voxora-traits` is the new (0.4) home of the traits voxora-core
# used to re-export. telora-models only needs `ModelSource` /
# `ResolveOptions`, so we pull the traits crate directly instead
# of `voxora-bridge` (which would drag in the whisper / qwen3asr
# engine feature baggage).
voxora-hf     = { workspace = true }
voxora-traits = { workspace = true }
telora-common = { workspace = true }

anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.36", features = ["full"] }

[dev-dependencies]
tempfile = "3"
