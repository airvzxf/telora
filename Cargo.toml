[workspace]
resolver = "2"
members = ["telora-common", "telora-daemon", "telora-gui", "telora-ctl", "telora-models"]

[workspace.package]
version = "0.7.4"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
# 0.6.4: `QwenAsrEngine::prepare_model_dir`, and Qwen3-ASR transcripts
# without the `<asr_text>` prefix when the language is forced.
voxora-hf        = "0.6.4"
voxora-bridge    = "0.6.4"
voxora-registry  = "0.6"
voxora-traits    = "0.6"
libsystemd      = "0.7"
telora-common    = { path = "telora-common" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
