[workspace]
resolver = "2"
members = ["telora-daemon", "telora-gui", "telora-ctl", "telora-models"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# voxora lives as a sibling repository (`../voxora`) when developing
# locally. All three voxora crates the telora workspace depends on
# are declared here so each member crate only has to opt into the
# features it wants.
#
# CI / production deployments should switch these to git or registry
# deps; for the phase-6 PR we keep path deps because voxora is not
# published yet.
[workspace.dependencies]
voxora-core    = { path = "../voxora/voxora-core" }
voxora-hf      = { path = "../voxora/voxora-hf" }
voxora-bridge  = { path = "../voxora/voxora-bridge" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
