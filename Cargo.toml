[workspace]
resolver = "2"
members = ["telora-daemon", "telora-gui", "telora-ctl", "telora-models"]

[workspace.package]
version = "0.1.1"
edition = "2024"

# voxora 0.1.x is on crates.io. telora-daemon pulls voxora-bridge with
# the `cuda-whisper` feature (see telora-daemon/Cargo.toml) to enable
# GPU-accelerated whisper.cpp on Pascal sm_61+ hardware; qwen3-asr stays
# on CPU because candle's WMMA kernels require sm_70+.
[workspace.dependencies]
voxora-core    = "0.1"
voxora-hf      = "0.1"
voxora-bridge  = "0.1.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
