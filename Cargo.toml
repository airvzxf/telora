[workspace]
resolver = "2"
members = ["telora-common", "telora-daemon", "telora-gui", "telora-ctl", "telora-models"]

[workspace.package]
version = "0.7.4"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
voxora-hf        = "0.6"
voxora-bridge    = "0.6"
voxora-registry  = "0.6"
voxora-traits    = "0.6"
voxora-minimax   = "0.6"
libsystemd      = "0.7"
telora-common    = { path = "telora-common" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
