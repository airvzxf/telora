[workspace]
resolver = "2"
members = ["telora-common", "telora-daemon", "telora-gui", "telora-ctl", "telora-models"]

[workspace.package]
# Minor bump 0.4.1 → 0.5.0 (Part of #142). Mirrors the voxora
# 0.4 → 0.5 coordinated minor release: telora follows the same
# major.minor line so a user reading the telora GitHub Release
# page sees a consistent version narrative with the underlying
# voxora-* crates it consumes. Triggers:
#   - voxora MSRV re-bump 1.86 → 1.88 (inherited from voxora
#     0.4.2 / EPIC #100; telora's workspace `rust-version` had
#     been lying since then);
#   - new additive capability: `ResolveOptions::max_bytes` is
#     wired at every production resolve call site in
#     telora-daemon / telora-models (closes #145, EPIC #148
#     adopted from voxora 0.5.3).
# No breaking API change for operators; no config-key churn.
#
# Patch bump 0.5.0 → 0.5.1 (closes #151). Enables `cuda-qwen3asr`
# on voxora-bridge in telora-daemon so Volta+ NVIDIA hosts get
# GPU-accelerated Qwen3-ASR out of the box, instead of the previous
# default that silently pinned qwen3-asr to CPU on every published
# binary (telora-bin AUR package, GitHub Release artefacts). candle's
# WMMA kernels still require sm_70+; on older hardware the runtime
# device picker falls back to CPU, so Pascal / AMD / no-GPU hosts
# are unaffected. No new public API surface, no config-key churn,
# no operator-visible change for any non-Qwen3-ASR user.
#
# Minor bump 0.5.1 → 0.6.0 (closes #160). Additive Makefile
# expansion: the 38-line `Makefile` (only `all`/`install`/`clean`)
# now mirrors the CI gates (`fmt-check`, `build-native`, `test`,
# `lint`) and adds discoverable developer/packaging/run targets
# (`build-native`, `build-release`, `check`, `fmt`, `lint`, `audit`,
# `ci`, `test-one`, `simulate`, `install-systemd-user`,
# `uninstall-systemd-user`, `reinstall`, `package`, `run-daemon`,
# `run-gui`, `run-ctl`, `run-models`, `setup-env`, `verify`,
# `clean-all`, `doctor`). Default goal changes from the legacy
# "Use ./scripts/build" hint to `help`. No existing target
# semantics change; PKGBUILD / telora-bin.install contract
# preserved (the AUR release job in `release.yml:593` still
# rewrites `pkgver` from the workspace tag). No breaking API
# change for operators; no config-key churn.
#
# Patch bump 0.7.0 → 0.7.1 (closes #165, #166, #167). Three
# follow-ups to the #163 MiniMax integration:
#   - **#166**: the bearer token NEVER lives in `telora.toml`.
#     The `minimax_api_key` field is gone; the daemon reads
#     `~/.config/telora/.env` (mode 0600 expected) and
#     `/etc/telora/.env` via `dotenvy` and falls back to the
#     env-var cascade (`VOXORA_MINIMAX_API_KEY` →
#     `MINIMAX_API_KEY`). New `--minimax-env-file PATH` CLI flag
#     overrides the file path for CI runners and one-off dev
#     shells. 5 deleted resolver unit tests, 6 new dotenv
#     unit tests in `telora-common/src/secrets.rs`.
#   - **#165**: `model_id` is now honoured for `model_kind =
#     "minimax"`. Empty / legacy-Whisper-default falls back to
#     voxora's `DEFAULT_MODEL = "asr-1.0"` with a one-line
#     `info!` log so the operator sees what was used.
#     `bridge.model_id()` stores the *resolved* value (not the
#     operator's raw input), and `build_transcriber` propagates
#     it back to `stt_config.model_id` so `telora-daemon status`
#     shows the actual loaded model rather than the stale
#     `default_stt_config()` Whisper id.
#   - **#167**: `StatusResponse` splits `model_path` (filesystem)
#     into two fields — `model_path` (on-disk engines) and
#     `endpoint` (hosted engines). The display branches on
#     which is non-empty so Whisper / Qwen3-ASR keep their
#     `Resolved Path:` line and MiniMax gets a clean
#     `Endpoint:` line. The previous single field was
#     overloading a URL under a filesystem-path-shaped heading.
# No public API breaking change. No config-key churn for
# Whisper / Qwen3-Asr users. Operators who previously set
# `minimax_api_key = "…"` in `telora.toml` need to move the
# line to `~/.config/telora/.env` as `MINIMAX_API_KEY=…`
# (mode 0600) on the next daemon restart — the PR's README
# "MiniMax hosted STT" section walks through the migration.
#
# Patch bump 0.7.1 → 0.7.2 (consumes voxora 0.6.1 + voxora-hf 0.6.2).
# Two upstream patch releases ship on 2026-09-13:
#   - **voxora 0.6.0 → 0.6.1** (coordinated, all 13 participating
#     crates ship at 0.6.1): API-compatible; additive only:
#     - `voxora-hf::HfClient::execute_with_retry` (closes
#       airvzxf/voxora#113) — bounded HTTP retry on transient errors
#       (timeout/connect/request) and 5xx/429 with exponential backoff
#       (250 ms × 2^(n-1), capped at 4 s, ±25 % jitter, honouring
#       `Retry-After` ≤ 30 s). New `HfError::RetriesExhausted { url,
#       attempts, last_error }` variant maps to `AsrError::network`
#       at the upstream layer; telora is unaffected because it
#       `?`-propagates `AsrError` directly.
#     - `voxora-hf::verify_sha256_sidecars` (closes
#       airvzxf/voxora#111) — streaming SHA256 over `tokio::fs::File`
#       in 64 KiB chunks. Peak RSS during a multi-shard resolve is
#       now bounded; a 24 GB Qwen3-ASR split into 4 shards no longer
#       allocates 24 GB up front.
#   - **voxora-hf 0.6.1 → 0.6.2** (single-crate patch, additive-
#     exception path per voxora AGENTS.md § "Version coordination"):
#     advisory `flock(2)`-style lock on `<model_dir>/.lock` to
#     serialise concurrent `HuggingFaceSource::resolve` calls against
#     the same `(model_id, revision)` (closes airvzxf/voxora#185).
#     New `HfError::LockUnavailable { path, attempts, message }`
#     variant maps to `AsrError::AudioIo { ErrorKind::WouldBlock }`
#     upstream; telora surfaces it transparently via the existing
#     `?`-propagation. Uses `fs2 = "0.4"` (no `unsafe`, satisfies
#     `#![forbid(unsafe_code)]`).
# Workspace dep pins stay `"0.6"` (caret matches both 0.6.1 and
# 0.6.2); `Cargo.lock` regenerates via `cargo update --workspace`.
#
# HONEST GAP (preserved from voxora 0.6.2): `voxora-hf` 0.6.2 does
# NOT honour `ResolveOptions::max_bytes` despite the upstream
# CHANGELOG claim. The 8 GiB cap telora-daemon / telora-models
# wire remains inert on the HF resolve path; it activates when
# voxora-hf enforces it (tracked via telora issue #148).
#
# No breaking API change for operators; no config-key churn.
# Operator-visible change: transient HF download failures now read
# `retries exhausted after N attempt(s): …` in daemon stderr /
# `telora-models download` failure output (was `transport error` /
# `HTTP <status>`). Log-grep filters that key on the old strings
# need to be updated. Worst-case additional latency before failure
# surfaces: ~1.25 s on transient reqwest errors; up to ~60 s if the
# upstream emits `Retry-After: 30`.
# Reference: voxora CHANGELOG
# https://github.com/airvzxf/voxora/blob/main/voxora-hf/CHANGELOG.md
version = "0.7.2"
edition = "2024"
# Pinned to voxora-bridge 0.4.2+ / 0.6.x's MSRV as published on
# crates.io (voxora-bridge 0.3+ bumped the MSRV to 1.86; the 0.4.2
# EPIC #100 cut raised it again to 1.88, driven by
# `whisper-rs-sys 0.15.0`). The CI workflow
# (`.github/workflows/ci.yml`) installs `stable` via
# `dtolnay/rust-toolchain`, so a workspace member or transitive
# dep that ever requires a feature newer than 1.88 will fail the
# build at the rustc stage instead of silently slipping through
# on an older GH-hosted apt rustc.
rust-version = "1.88"

# voxora 0.5 is a coordinated minor release (closes
# airvzxf/voxora#117, #124, #133, #145, #148). Every workspace
# crate that participates in the release ships at 0.5.x per
# voxora's `AGENTS.md` → Version coordination policy. The
# `voxora-bridge` umbrella picked up a `local` Cargo feature
# (re-export of `voxora-local`), the canonical `registry`
# Cargo feature (re-export of `voxora-registry`'s
# `Registry` / `RegistryHfExt` / `builtin_local_descriptor`,
# closes voxora#145), and the cross-engine `parity` test feature
# (closes voxora#59 / EPIC #133). No breaking change for
# consumers: the trait surface is unchanged from 0.4.x.
#
# voxora 0.4 was a breaking release that closed voxora issue #42:
# the `voxora-core` deprecation shim that shipped in 0.3 has been
# removed entirely, and the traits it used to re-export
# (`AsrEngine`, `ModelSource`, `ResolveOptions`, `AsrError`,
# `ModelCapabilities`, `ModelDir`, …) now live in `voxora-traits`.
# `voxora-bridge` re-exports `voxora_traits::*` in its umbrella
# surface, so consumers that already pull `voxora-bridge`
# (`telora-daemon`) keep working with `voxora_bridge::AsrEngine`,
# `voxora_bridge::ModelSource`, etc. without seeing the deprecation
# warning that bit them on the 0.3 line.
#
# voxora 0.4.2 / EPIC #100 raised the MSRV from 1.86 → 1.88
# (driven by `whisper-rs-sys 0.15.0`); 0.4.3 / EPIC #109 hardened
# `voxora-hf::split_three_segment_id` (path-traversal in
# `ModelId::parse`, airvzxf/voxora#102) and gave `HfClient::get_to_file`
# unique tmp suffixes for concurrent downloads (#103). The
# daemon's resolve path inherits both — the operator's cache
# layout is unchanged but the underlying parser / writer is now
# defensive against the hostile-id and concurrent-shard classes
# of bug.
#
# voxora 0.5.3 / EPIC #148 (closes airvzxf/voxora#143, #144)
# added `ResolveOptions::max_bytes` and `ResolveOptions::max_id_length`
# (`#[non_exhaustive]` on `ResolveOptions`; defaults `None`). The
# daemon wires `max_bytes = 8 GiB` at the production resolve call
# sites (see `telora-daemon/src/transcriber.rs`); the cap clears
# the largest legitimate artifact (Qwen3-ASR-1.7B ~3.4 GB) with
# ~2.4x headroom. HONEST GAP: `voxora-hf` 0.6.2 (and 0.5.1+) does not
# yet honour `max_bytes` despite the voxora-traits CHANGELOG claiming
# it does — the field exists but is not plumbed through
# `HfClient::get_to_file`. The cap is therefore inert on the
# daemon's HF resolve path today; it activates the moment
# voxora-hf enforces it (tracked upstream).
#
# voxora 0.2.x carried the structural fix for airvzxf/telora#79:
# `voxora-hf::resolve_single_file` rejects a cache whose
# `.complete` marker is set but the requested file is missing
# (`AsrError::ModelNotFound`), and `ModelDir::entry` names the
# exact file for `org/repo/file` resolves so the daemon never has
# to lex-sort `*.bin` files. voxora 0.3 → 0.6 keep those
# semantics — the registry test (`voxora_020_resolution`) still
# pins the same shape against the current line.
#
# `voxora-registry` (new in 0.2) gives us the canonical resolution
# path `Registry::resolve(&ModelId::parse(id), &opts) → ResolvedModel {
# descriptor, model_dir }`. telora-daemon still goes through it,
# with `Registry::with_builtin_descriptors()` (via `RegistryHfExt`)
# so the built-in Whisper + Qwen3Asr descriptors are registered.
# We DO NOT use `hf_registry()` because it constructs its own
# `HuggingFaceSource` internally and bypasses the `cache_dir`
# override the operator needs to keep their existing
# `~/.cache/voxora/models/huggingface/…` cache. voxora 0.5.4
# hardened `ModelId::parse`'s local arm against `..` components,
# control characters, and embedded NULs (closes voxora#143);
# the daemon's HF id path inherits the upstream HF 3-segment
# hardening from voxora 0.4.3 / #102.
#
# telora-daemon pulls voxora-bridge 0.6 with the `cuda-whisper`,
# `cuda-qwen3asr`, and `minimax` features (see telora-daemon/Cargo.toml)
# so all three backends are compiled in by default. `cuda-whisper`
# covers whisper.cpp on Pascal sm_50+; `cuda-qwen3asr` covers qwen3-asr
# on Volta sm_70+ (candle's WMMA kernels need Volta — older hardware
# transparently falls back to CPU at runtime); `minimax` re-exports
# `voxora-minimax 0.6.1` (closes airvzxf/voxora#157 / EPIC #153), the
# first hosted-API engine adapter in the voxora workspace, so
# operators with `model_kind = "minimax"` can POST audio to the
# MiniMax `/v1/speech_to_text` endpoint without any on-disk model
# or GPU dependency (compute is server-side; only the bearer-token
# round-trip runs locally). voxora-bridge also exposes `cuda`
# (umbrella), `metal`, `vulkan`, `local`, `registry`, and `parity`
# features for downstream consumers. The cross-engine hardware
# matrix (CUDA / Metal / Vulkan per engine) is documented at
# https://github.com/airvzxf/voxora/blob/main/docs/GPU_SUPPORT.md
# (airvzxf/voxora#55 / EPIC #117).
#
# telora-models now depends on `voxora-traits` directly (instead
# of pulling `voxora-bridge` with its whisper / qwen3asr feature
# baggage). telora-models is a model-management CLI — it only
# needs the trait surface (`ModelSource`, `ResolveOptions`) and
# not the engine adapters. The same 8 GiB cap the daemon wires
# is also wired here (see `telora-models/src/main.rs`).
[workspace.dependencies]
voxora-hf        = "0.6"
voxora-bridge    = "0.6"
voxora-registry  = "0.6"
voxora-traits    = "0.6"
# `voxora-minimax` (closes #163): the first hosted-API engine
# adapter in the voxora workspace, re-exported by `voxora-bridge`
# behind the new `minimax` Cargo feature. Direct workspace dep so
# `telora-daemon`'s `[[test]] required-features = ["minimax"]`
# entry can pull it as a dev-dependency and compile the live JFK
# integration test without re-fetching it via the bridge.
voxora-minimax   = "0.6"
libsystemd      = "0.7"
telora-common    = { path = "telora-common" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
