[workspace]
resolver = "2"
members = ["telora-daemon", "telora-gui", "telora-ctl", "telora-models"]

[workspace.package]
version = "0.1.2"
edition = "2024"
# Pinned to voxora-bridge 0.2.0's MSRV as published on crates.io
# (voxora-bridge 0.3.0 will bump to 1.86). The CI workflow
# (`.github/workflows/ci.yml`) installs this exact toolchain via
# `dtolnay/rust-toolchain`, so a workspace member or transitive
# dep that ever requires a feature newer than 1.85 will fail the
# build at the rustc stage instead of silently slipping through
# on an older GH-hosted apt rustc.
rust-version = "1.85"

# voxora 0.2.x is on crates.io and carries the structural fix for
# airvzxf/telora#79: `voxora-hf::resolve_single_file` now rejects a
# cache whose `.complete` marker is set but the requested file is
# missing (`AsrError::ModelNotFound`), and the new `ModelDir::entry`
# field names the exact file for `org/repo/file` resolves so the
# daemon never has to lex-sort `*.bin` files.
#
# `voxora-registry` (new in 0.2) gives us the canonical resolution
# path `Registry::resolve(&ModelId::parse(id), &opts) → ResolvedModel {
# descriptor, model_dir }`. telora-daemon now goes through it, with
# `Registry::with_builtin_descriptors()` (via `RegistryHfExt`) so the
# built-in Whisper + Qwen3Asr descriptors are registered. We DO NOT
# use `hf_registry()` because it constructs its own `HuggingFaceSource`
# internally and bypasses the `cache_dir` override the operator needs
# to keep their existing `~/.cache/voxora/models/huggingface/…` cache.
#
# telora-daemon pulls voxora-bridge with the `cuda-whisper` feature
# (see telora-daemon/Cargo.toml) to enable GPU-accelerated whisper.cpp
# on Pascal sm_61+ hardware; qwen3-asr stays on CPU because candle's
# WMMA kernels require sm_70+.
[workspace.dependencies]
voxora-core      = "0.2"
voxora-hf        = "0.2"
voxora-bridge    = "0.2"
voxora-registry  = "0.2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
