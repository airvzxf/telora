name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev libgtk-4-dev libgtk-4-1 \
          build-essential cmake pkg-config \
          nvidia-cuda-toolkit
        # Verify nvcc is available so a missing CUDA toolkit fails the job loudly
        # before we waste time compiling rust crates that need it.
        nvcc --version

    - name: Format
      run: cargo fmt --all -- --check

    - name: Build (workspace)
      run: cargo build --workspace --all-targets

    - name: Test (workspace, no fail-fast)
      run: cargo test --workspace --no-fail-fast

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    # Skipping full build for now as CUDA setup in GH Actions is complex/slow
    # - name: Build
    #   run: cargo build --verbose
