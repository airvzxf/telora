name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # candle-kernels (pulled in transitively when `cuda-qwen3asr` is
  # enabled on voxora-bridge) calls `nvidia-smi` to auto-detect the
  # GPU compute capability. The GH-hosted Ubuntu 24.04 runner has
  # `nvidia-cuda-toolkit` (CUDA 12.0) but no NVIDIA driver, so
  # `nvidia-smi` is missing and `bindgen_cuda` panics. Pin the arch
  # explicitly: sm_80 (Ampere) is the lowest arch candle's WMMA
  # kernels (BF16 fragments) compile against and is supported by
  # CUDA 12.0. The binary never executes on CI; only the compile
  # path matters here.
  CUDA_COMPUTE_CAP: "80"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Pin a rustc toolchain so a future dep bump that needs a newer
    # rustc fails the build loudly instead of silently slipping
    # through on the GH-hosted image's default rustc. Ubuntu 24.04
    # (Noble) only ships apt rustc 1.81, below voxora-bridge 0.6.x's
    # MSRV of 1.88 (raised in voxora EPIC #100 / 0.4.2, driven by
    # `whisper-rs-sys 0.15.0`) — without this step the build happens
    # to compile today only because every dep we use happens to be
    # MSRV-compatible with 1.81. `dtolnay/rust-toolchain` matches
    # the action voxora uses in its own `.github/workflows/ci.yml`
    # (same SHA pin) so the two projects stay in lockstep.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev libgtk-4-dev libgtk-4-1 \
          libwayland-dev wayland-protocols \
          meson ninja-build \
          build-essential cmake pkg-config \
          nvidia-cuda-toolkit

        # Ubuntu 24.04 (Noble) does NOT ship an apt package for the GTK4
        # C library `gtk4-layer-shell`. Noble only has `libgtk-layer-shell-dev`
        # which is the GTK3 variant and installs `gtk-layer-shell-0.pc`
        # (note: no `4`), so `pkg-config gtk4-layer-shell-0` fails and
        # `cargo build` for telora-gui aborts. The `libgtk4-layer-shell-dev`
        # package is only in Plucky (25.04) and later, so we build the C
        # library from source at the tag that matches the Rust crate's
        # `v1_3` feature (`gtk4-layer-shell-sys` 0.5.2 requires >= 1.3).
        git clone --depth 1 --branch v1.3.0 \
          https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
        sudo meson setup \
          -Dexamples=false -Ddocs=false -Dtests=false \
          -Dintrospection=false -Dvapi=false \
          /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
        sudo ninja -C /tmp/gtk4-layer-shell/build install
        sudo ldconfig
        # Fail loudly here (instead of deep in cargo's pkg-config probe) if
        # the .pc file did not land where pkg-config expects it.
        pkg-config --modversion gtk4-layer-shell-0

        # Verify nvcc is available so a missing CUDA toolkit fails the job loudly
        # before we waste time compiling rust crates that need it.
        nvcc --version

    - name: Format
      run: cargo fmt --all -- --check

    - name: Build (workspace)
      run: cargo build --locked --workspace --all-targets

    - name: Test (workspace, no fail-fast)
      run: cargo test --locked --workspace --no-fail-fast

    - name: Clippy
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

    # Skipping full build for now as CUDA setup in GH Actions is complex/slow
    # - name: Build
    #   run: cargo build --verbose

  # Validates the Containerfile end-to-end. The Rust-native `build` job
  # above catches src/Cargo.toml regressions; this one catches
  # Containerfile-specific regressions (chef recipe, gcc-14 install,
  # runtime image copy, ENTRYPOINT). It runs only on pull_request
  # because the squash-merge already validated the build when the PR
  # was open. Cached via GitHub Actions cache (`type=gha`) so repeat
  # PRs are ~5 min instead of ~25 min cold. Does NOT run on `push`
  # to `main` (the squash-merge of the PR already validated this).
  containerfile-build:
    name: Containerfile · build + smoke
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Containerfile (cached)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Containerfile
        tags: telora-daemon:ci-${{ github.event.pull_request.number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Extract binaries from runtime image
      # Mirrors `scripts/build`: cat each binary out of the runtime
      # stage's /usr/bin. CLI binaries (telora, telora-models) are
      # pure Rust with no special dynamic deps, so they run on the
      # GH runner. telora-gui needs libgtk4-layer-shell from the
      # runtime image and is smoke-tested inside a fresh container
      # below; telora-daemon needs libcuda.so.1 which the runner
      # does not have, so we skip its smoke test entirely.
      run: |
        mkdir -p bin
        for b in telora telora-models; do
          docker run --rm --entrypoint /bin/sh \
            "telora-daemon:ci-${{ github.event.pull_request.number }}" \
            -c "cat /usr/bin/$b" > "bin/$b"
        done
        chmod +x bin/telora bin/telora-models
        ls -la bin/

    - name: Smoke test (CLI binaries on host runner)
      run: |
        ./bin/telora --version
        ./bin/telora-models --version

    - name: Smoke test (telora-gui inside runtime image)
      # telora-gui links against libgtk4-layer-shell.so.0 which lives
      # inside the runtime image, so the smoke test must run there
      # too. --help exits before any Wayland init, so this works
      # even on a headless GH runner.
      run: |
        docker run --rm --entrypoint /usr/bin/telora-gui \
          "telora-daemon:ci-${{ github.event.pull_request.number }}" \
          --help | head -5
