name: advisories

# `cargo deny check advisories` (RustSec + yanked crates). The advisory
# database moves independently of the code, so the daily run reports
# new advisories without blocking unrelated PRs; PRs only run it when
# they change dependencies or the ignore list.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/advisories.yml'

permissions:
  contents: read

jobs:
  cargo-deny-advisories:
    name: 'cargo-deny · advisories'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny check advisories
        run: cargo deny check advisories
