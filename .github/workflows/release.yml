name: release

on:
  push:
    # Conventional SemVer tag. The 'v' prefix is required because the
    # release flow uses `git tag -s vX.Y.Z` locally.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.0). Must exist on the remote.'
        required: true
        type: string
        # Constrains the manual path to the same shape the `push` tag
        # filter enforces; a malformed tag string fails fast in the
        # validate-tag-input job below instead of producing a
        # confusing `git rev-parse` error mid-build.
        pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

# Releases need to write tags and create a GitHub Release page, but only the
# `publish` job does — the `build-release` job only reads repo contents. Scoping
# `contents: write` to the `publish` job applies the principle of least
# privilege at the workflow level.

# Do not let two release jobs for the same tag run in parallel; the
# second one would race the upload.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Default permissions for every job. Each job narrows or
# escalates its own `permissions:` block below; the publish job
# needs `contents: write` to create the GitHub Release.
permissions:
  contents: read

jobs:
  # Tag-input validator: the `push` trigger filters to
  # `v[0-9]+.[0-9]+.[0-9]+` so a manual dispatch could otherwise
  # feed arbitrary strings (`main`, `refs/tags/v…`, leading
  # whitespace, etc.) into `git rev-parse`, producing a confusing
  # failure mid-build. This job runs first and fails fast on a
  # malformed tag name. It also confirms the tag exists on the
  # remote — the push trigger guarantees this for tag events, but
  # the dispatch path is unvalidated otherwise.
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "ERROR: '$TAG' is not vX.Y.Z"; exit 1; }
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

  # Tag-reachability guard: enforces the "tag the trunk merge commit,
  # NOT the branch tip" rule mechanically. If the tag's commit is
  # not an ancestor of origin/main, the workflow fails before any
  # binary is built. Defense in depth — the procedural rule still
  # lives in README.md; this job is the structural check.
  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
      main_commit: ${{ steps.resolve.outputs.MAIN_COMMIT }}
    steps:
      - name: Checkout at tag SHA
        # Pinning to the resolved SHA (not the ref) closes the TOCTOU
        # gap with build-release: `git rev-parse ${TAG}^{commit}`
        # produces an immutable object SHA, and any subsequent tag
        # force-push cannot redirect the workflow to a different
        # commit. The allow-list fetch in `verify-tag-signature`
        # is the second half of the same closure.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "This means the tag was created on a branch tip or a local"
            echo "commit that was later squashed away when the release PR"
            echo "was merged into main. The release would publish a binary"
            echo "whose SHA does not correspond to any commit reachable from"
            echo "main, breaking the audit log."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git checkout main && git reset --hard origin/main"
            echo "  git tag -s ${TAG} \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  # Tag-signature guard: verifies that the tag was GPG/SSH-signed by
  # a key listed in `.github/trusted-signers` before any binary is
  # built or published. The allow-list is fetched from `origin/main`
  # (NOT the tagged tree) so revoking a key on main takes effect on
  # the next release — otherwise the trust anchor would be the same
  # object being verified and revocation is structurally impossible.
  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    steps:
      - name: Checkout at ref
        # Shallow checkout so the runner has a `.git/` to operate on
        # for `git fetch` and `git show`. Pinning to the SHA is the
        # `build-release` job's responsibility.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch allow-list from origin/main
        # The trust anchor lives on `main`, not on the tagged tree
        # the workflow is verifying. Reading it from the tagged
        # tree makes key revocation ineffective: a compromised key
        # could re-cut a tag pointing at an old commit whose tree
        # still lists that key, and verification would pass.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "origin/main:.github/trusted-signers" \
            > "$RUNNER_TEMP/trusted/allowed_signers"
          # `.asc` is optional: only imported when the tag is actually
          # PGP-signed (current and historical telora tags). SSH-only
          # signers never consult this file.
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "GPG allow-list fetched"
          else
            echo "GPG allow-list absent on origin/main (acceptable; SSH-only signers)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: empty .github/trusted-signers on origin/main"; exit 1; }

      - name: Configure git to use the trusted signers file
        # `git verify-tag` consults `gpg.ssh.allowedsignersfile` for
        # SSH-signed tags and the GPG keyring for PGP-signed tags.
        # Both paths auto-detect from the tag's signature format.
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Import GPG allow-list if the tag is PGP-signed
        # Only when the tag being verified is PGP-signed; SSH-signed
        # tags never need the GPG keyring. Keeps the documented
        # key-removal path intact.
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git cat-file tag "$TAG" | grep -q 'BEGIN PGP SIGNATURE'; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag uses SSH signature — GPG keyring not required"
          fi

      - name: Verify tag signature
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "${TAG}"; then
            echo "✓ ${TAG} is signed by a key in .github/trusted-signers"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (fetched from origin/main)."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Allow-list (SSH): $(wc -l < "$RUNNER_TEMP/trusted/allowed_signers") lines"
            echo ""
            echo "Either the tag is unsigned, or it was signed by a key"
            echo "not on the allow-list."
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}'"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  # Telora ships 4 binaries (telora-daemon, telora-gui, telora,
  # telora-models). The install step mirrors `.github/workflows/ci.yml`
  # so a tag that builds here will also build cleanly on the next PR
  # to main — same CUDA toolkit, same gtk4-layer-shell source build.
  build-release:
    name: 'Build · release binaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [verify-tag-reachability, verify-tag-signature]
    steps:
      - name: Checkout at pinned tag SHA
        # Pinning to the immutable commit SHA (resolved by
        # `verify-tag-reachability` and propagated through the job
        # graph) closes the TOCTOU gap: a tag force-push that arrives
        # mid-workflow cannot redirect checkout away from the commit
        # the two verify jobs just approved.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      # Pin a rustc toolchain that matches ci.yml's pin (same SHA)
      # so the release artefact is built with the same compiler that
      # validated the merge commit. See ci.yml for the rationale.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        # Mirror of ci.yml: Ubuntu 24.04 (Noble) does not ship
        # `libgtk4-layer-shell-dev` (only the GTK3 variant), so we
        # build the C library from source at the same tag the Rust
        # crate's `v1_3` feature requires (`gtk4-layer-shell-sys`
        # 0.5.2 needs >= 1.3).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgtk-4-dev libgtk-4-1 \
            libwayland-dev wayland-protocols \
            meson ninja-build \
            build-essential cmake pkg-config \
            nvidia-cuda-toolkit
          git clone --depth 1 --branch v1.3.0 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          sudo meson setup \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false \
            /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
          pkg-config --modversion gtk4-layer-shell-0

      - name: Build release binaries (cold)
        # Cold build by design: GitHub Actions caches are scoped per-ref
        # (https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache),
        # and tag-to-tag restore is forbidden. CI on main continues
        # to use rust-cache (via the dedicated workflow); releases
        # pay ~5 min cold build per tag, which is acceptable for
        # 1-2 releases/week.
        run: cargo build --release --locked --workspace --bins

      - name: Strip binaries
        # `cargo build --release` already strips on Linux for the
        # `release` profile (`strip = "symbols"` is the default in
        # the workspace). This step is defensive: if a future change
        # ever disables that, this `strip` invocation keeps the
        # release artefacts small.
        run: |
          set -euo pipefail
          for bin in telora-daemon telora-gui telora telora-models; do
            BIN="target/release/${bin}"
            test -x "${BIN}" || { echo "ERROR: missing ${BIN}"; exit 1; }
            strip --strip-unneeded "${BIN}"
            ls -la "${BIN}"
          done

      - name: Locate binaries
        id: locate
        run: |
          set -euo pipefail
          for bin in telora-daemon telora-gui telora telora-models; do
            BIN="${RUNNER_TEMP}/release-artifacts/${bin}"
            mkdir -p "$(dirname "${BIN}")"
            cp "target/release/${bin}" "${BIN}"
            echo "${bin}=${BIN}" >> "$GITHUB_OUTPUT"
          done
          ls -la "${RUNNER_TEMP}/release-artifacts/"

      - name: Compute SHA-256 checksums
        id: sha256
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          ( cd "${ART_DIR}" && sha256sum telora-daemon telora-gui telora telora-models ) \
            > "${ART_DIR}/SHA256SUMS"
          cat "${ART_DIR}/SHA256SUMS"

      - name: Compute SHA-512 checksums
        id: sha512
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          ( cd "${ART_DIR}" && sha512sum telora-daemon telora-gui telora telora-models ) \
            > "${ART_DIR}/SHA512SUMS"
          cat "${ART_DIR}/SHA512SUMS"

      - name: Smoke gates (binary sanity)
        # Each binary must at least load and reach the clap parser
        # before the artefacts are published. `--version` is the
        # cheapest way to catch a broken build: the daemon exits
        # before audio init; the GUI exits before any Wayland
        # init. Full smoke (e.g. the simulate.sh START→STOP cycle)
        # is too heavy for a release gate and runs in the regular
        # CI pipeline.
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          "${ART_DIR}/telora-daemon" --version
          "${ART_DIR}/telora-gui" --help | head -5
          "${ART_DIR}/telora" --version
          "${ART_DIR}/telora-models" --version

      - name: Generate SBOM (CycloneDX JSON)
        # Anchore's sbom-action builds a CycloneDX JSON in-tree.
        # The default 'docker' build-mode would spin Docker; we use
        # 'auto' which detects cargo and produces a Cargo-aware SBOM
        # (transitive deps from Cargo.lock, licenses from Cargo.toml,
        # project metadata from the workspace package).
        #
        # The action (v0.24.0) does NOT accept `source-name` /
        # `source-version` as direct inputs; Syft's source metadata
        # is configured via a `.syft.yaml` config file referenced
        # through `with: config:`. Adding a Syft config file is out
        # of scope for this release fix; the SBOM continues to
        # report source as "directory@<sha>" until that lands.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: telora.sbom.cdx.json

      - name: Download SBOM into workspace
        # anchore/sbom-action no longer writes the SBOM to the
        # workspace; it only uploads it as a separate artifact.
        # Pull the SBOM back into the workspace root so the
        # downstream `Bundle artifacts` step's `cp` finds it. The
        # action's own artifact upload is preserved (so the SBOM
        # remains downloadable via the run page); we just need the
        # file on disk too.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora.sbom.cdx.json
          path: ${{ github.workspace }}/

      - name: Verify SBOM downloaded
        # Fail-fast when the SBOM file isn't on disk. The downstream
        # `cp` would also fail (because of `set -euo pipefail`), but
        # a clearer error message lands earlier in the run log.
        run: |
          test -f "${{ github.workspace }}/telora.sbom.cdx.json" \
            || { echo "ERROR: SBOM file missing after download"; exit 1; }

      - name: Stage SBOM with the binaries
        # v4's actions/upload-artifact strips the longest common
        # directory prefix of all matched paths from each zip entry.
        # The SBOM lives at ${{ github.workspace }} (a sibling of
        # release-artifacts/), so the LCA collapses to /home/runner/work
        # and the zip ends up nested at _temp/release-artifacts/ and
        # _telora/ — neither at the root the consumers expect.
        # Stage the SBOM under release-artifacts/ so all 7 files
        # share one parent and v4's stripping gives a flat zip.
        run: cp "${{ github.workspace }}/telora.sbom.cdx.json" "${{ runner.temp }}/release-artifacts/"
      - name: Append SBOM checksum to SHA256SUMS / SHA512SUMS
        # The initial `Compute SHA-*` steps ran before the SBOM was
        # generated (Syft hasn't scanned the workspace yet at that
        # point), so the SBOM line is appended here after the SBOM
        # has been staged next to the binaries. `>>` preserves the
        # binary checksums already on disk.
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          ( cd "${ART_DIR}" && sha256sum telora.sbom.cdx.json ) >> "${ART_DIR}/SHA256SUMS"
          ( cd "${ART_DIR}" && sha512sum telora.sbom.cdx.json ) >> "${ART_DIR}/SHA512SUMS"
          cat "${ART_DIR}/SHA256SUMS"
          cat "${ART_DIR}/SHA512SUMS"
      - name: Upload bundle for the publisher job
        # The bundle includes 4 binaries + 2 checksum files + the
        # CycloneDX SBOM. Strip is performed on each binary in a
        # dedicated step above. The SBOM is staged next to the
        # binaries by the previous step so v4 of
        # actions/upload-artifact emits a flat zip (single-line
        # glob, all 7 files under one common parent).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telora-release-bundle
          path: ${{ runner.temp }}/release-artifacts/*
          retention-days: 7
          if-no-files-found: error

  # AUR (Arch User Repository) package build. Runs in a fresh
  # `archlinux:latest` container so `makepkg` and the AUR tooling
  # are available without polluting the Ubuntu runner. The
  # `build-release` job's binary artefacts are downloaded and
  # staged into `bin/` where the existing PKGBUILD expects them;
  # `make install` then packs everything into the AUR tree.
  build-aur-package:
    name: 'Build · AUR package (Arch)'
    needs: [build-release, validate-tag-input, verify-tag-reachability]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: read is enough — the AUR build only downloads the
    # build-release artefact and stages it under makepkg's
    # filesystem. The package itself is uploaded via the upload-
    # artefact action which uses the runner's per-job token, not the
    # workflow's GITHUB_TOKEN contents scope.
    permissions:
      contents: read
    container:
      image: archlinux:latest
      # makepkg needs to chroot the build by default; privileged
      # is the simplest way to opt in for an ephemeral container.
      options: --privileged
    steps:
      - name: Install build dependencies
        # `base-devel` provides makepkg, gcc, make, binutils, etc.
        # The build itself doesn't compile Rust (binaries come from
        # the build-release artefact), but `base-devel` is the
        # conventional group for AUR package builds and the
        # overhead is small.
        run: |
          pacman -Syu --noconfirm --needed base-devel git

      - name: Checkout telora at the tagged commit
        # The AUR job references in-repo paths via `working-directory:`
        # (notably `pkg/` for PKGBUILD and `telora-bin.install`), but the
        # archlinux container starts with an empty workspace — no step
        # in `build-aur-package` inherits a checkout from `build-release`,
        # so `pkg/` and friends are absent. Without this step the
        # PKGBUILD-update / makepkg / verify steps all fail with
        # `OCI runtime exec failed: chdir to cwd (.../pkg) ... no such
        # file or directory`.
        #
        # Pin `ref` to the resolved tag commit SHA (the same one
        # `build-release` uses at line 266) instead of the raw tag /
        # branch ref. The branch tip could move between tag-resolution
        # and the checkout; a SHA pins the AUR build to the same commit
        # the GitHub Release artefacts were produced from, so the
        # published `.pkg.tar.zst`'s embedded `pkg/PKGBUILD` and
        # `telora-bin.install` match the binaries it wraps. Without
        # this, a force-push to `main` after the tag was created could
        # silently produce an AUR package whose source tree disagrees
        # with its binaries.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      - name: Verify arch matches the release binaries
        # Sanity check: the AUR package is `x86_64`, so the
        # container must be x86_64. Cross-arch packaging is
        # possible (qemu-user) but not what we want.
        run: |
          test "$(uname -m)" = "x86_64" \
            || { echo "ERROR: AUR build must run on x86_64 (got $(uname -m))"; exit 1; }

      - name: Download release artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora-release-bundle
          path: release/

      - name: Stage release binaries in bin/
        # PKGBUILD's `build()` checks for the four binaries in
        # `bin/` (project root, not `pkg/bin/`). Copying them from
        # the downloaded artefact satisfies the check and matches
        # the upstream `./scripts/build` flow.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p bin
          for bin in telora-daemon telora-gui telora telora-models; do
            cp "release/${bin}" "bin/${bin}"
            chmod 755 "bin/${bin}"
          done
          ls -la bin/

      - name: Update PKGBUILD for the tagged version
        # The PKGBUILD's `pkgver` and the install hook's "Telora X.Y.Z"
        # message both need to track the tag. The release flow
        # bumps these manually before opening the release PR; this
        # step is defence-in-depth so a stale PKGBUILD never
        # produces a mis-versioned package.
        working-directory: pkg
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i 's|^\([[:space:]]*\)echo ":: Telora [0-9].*|\1echo ":: Telora '"${VERSION}"' has been installed."|' telora-bin.install
          echo "After update:"
          grep -E '^(pkgver|pkgrel)=' PKGBUILD
          grep -E '^[[:space:]]*echo ":: Telora '"${VERSION}"' has been installed."' telora-bin.install || { echo "ERROR: post-install message not updated"; exit 1; }

      - name: Build AUR package as non-root user
        # `-s` installs missing `makedepends` automatically (none
        # expected: PKGBUILD declares only `make`, which base-devel
        # provides). `--noconfirm` skips the interactive package
        # selection prompts. `--nocheck` skips the (none) check
        # function. The resulting `.pkg.tar.zst` lands in
        # `$GITHUB_WORKSPACE/pkg/`.
        #
        # GitHub Actions `container:` jobs run as root, and `makepkg`
        # hard-rejects root invocations since pacman 5.0. We
        # `useradd` a build user, `su` into it for the makepkg call,
        # then restore root ownership of the workspace so the upload
        # step below can read the `.pkg.tar.zst`.
        working-directory: pkg
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash build
          # Allow `build` to invoke `pacman` without a password so makepkg -s
          # can satisfy the PKGBUILD's `depends` array. NOPASSWD is scoped
          # to /usr/bin/pacman only; the build user still cannot read or
          # modify anything outside its home and the workspace, and cannot
          # invoke any other command via sudo.
          echo 'build ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/build-pacman
          chmod 0440 /etc/sudoers.d/build-pacman
          chown -R build:build "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pkg"
          # Pass through any extra pacman flags makepkg uses; the env var
          # PACMAN_OPTS is consumed by makepkg, not by the sudoers entry.
          su build -c 'makepkg -s --noconfirm --nocheck'
          # Restore ownership so the upload step can read the .pkg.tar.zst
          chown -R root:root "$GITHUB_WORKSPACE/pkg"
          ls -la *.pkg.tar.zst

      - name: Verify AUR package contents
        # Sanity check: the package must contain the four binaries
        # with mode 0755, the two systemd units, and the config
        # file. If any of these is missing, the package is broken
        # and we should fail the job.
        working-directory: pkg
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/pkg"
          PKG=$(ls *.pkg.tar.zst | head -1)
          echo "Inspecting $PKG"
          tar -tf "$PKG" | sort
          tar -tf "$PKG" | grep -E '^usr/bin/(telora-daemon|telora-gui|telora|telora-models)$' \
            || { echo "ERROR: AUR package missing one or more binaries"; exit 1; }
          tar -tf "$PKG" | grep -E '^usr/lib/systemd/user/telora.*\.(service|socket)$' \
            || { echo "ERROR: AUR package missing systemd units"; exit 1; }
          tar -tf "$PKG" | grep -E '^etc/telora\.toml$' \
            || { echo "ERROR: AUR package missing /etc/telora.toml"; exit 1; }

      - name: Upload AUR package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telora-aur-package
          path: pkg/*.pkg.tar.zst
          retention-days: 7
          if-no-files-found: error

  publish:
    name: 'Publish · GitHub Release'
    needs: [build-release, build-aur-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora-release-bundle
          path: release/

      - name: Download AUR package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora-aur-package
          path: aur/

      - name: Extract metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          # Upload the four binaries, two checksum files, the
          # CycloneDX SBOM, and the AUR `.pkg.tar.zst`. The AUR
          # package is what Arch users install via
          # `pacman -U telora-bin-X.Y.Z-1-x86_64.pkg.tar.zst`
          # after downloading from the release page.
          files: |
            release/telora-daemon
            release/telora-gui
            release/telora
            release/telora-models
            release/SHA256SUMS
            release/SHA512SUMS
            release/telora.sbom.cdx.json
            aur/*.pkg.tar.zst
          fail_on_unmatched_files: true
          # Mark this as the latest release unless the tag is a pre-release.
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
