name: release

on:
  push:
    # Conventional SemVer tag. The 'v' prefix is required because the
    # release flow uses `git tag -s vX.Y.Z` locally. The wildcard
    # accepts both stable (v0.5.0) and SemVer 2.0.0 pre-release
    # identifiers (v0.5.0-rc.1) — the previous `v[0-9]+.[0-9]+.[0-9]+[-.0-9A-Za-z]*`
    # pattern was syntactically invalid in GitHub Actions' tag-glob
    # grammar (it rejected any tag push with HTTP 422 "push event
    # contained invalid tags patterns"), so the release workflow
    # has not fired on a tag push since PR #133 landed. The full
    # SemVer shape is validated downstream by `validate-tag-input`
    # (`pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'`).
    tags:
      - 'v*'
  # No `workflow_dispatch:` trigger on purpose. The release flow
  # is tag-push-only — `git tag -s vX.Y.Z && git push origin vX.Y.Z`
  # on the maintainer's workstation is the documented release path
  # (see README.md § Release process). The `verify-tag-signature`
  # job gates the workflow on a GPG signature from a key in
  # `.github/trusted-signers`, which a `workflow_dispatch` input
  # would bypass (no tag object exists to verify) — so a manual
  # trigger widened the attack surface for zero operational gain.
  # To re-run a failed release, delete the broken tag locally and
  # push it again (or amend the commit and re-tag — `--force`
  # on the tag is fine because the workflow keys on the new commit).

# Releases need to write tags and create a GitHub Release page, but only the
# `publish` job does — the `build-release` job only reads repo contents. Scoping
# `contents: write` to the `publish` job applies the principle of least
# privilege at the workflow level.

# Do not let two release jobs for the same tag run in parallel; the
# second one would race the upload.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Default permissions for every job. Each job narrows or
# escalates its own `permissions:` block below; the publish job
# needs `contents: write` to create the GitHub Release.
permissions:
  contents: read

jobs:
  # Tag-input validator. The trigger is `push: tags: 'v*'`, so
  # `github.ref_name` is already the tag name (e.g. `v0.7.4`).
  # This job still re-validates the SemVer shape because tag-glob
  # patterns can match weird strings (`v` alone, `v1.0`,
  # leading whitespace from a malformed push, etc.) and the
  # downstream `git rev-parse ${TAG}^{commit}` would otherwise fail
  # mid-build with a confusing error. Fails fast here.
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          RAW: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          # Mirrors the push-trigger tag-glob (`v*`) and the documented
          # SemVer 2.0.0 shape (including pre-release suffixes like
          # `-rc.1`) so both validators agree on the canonical tag
          # set the maintainer signs locally.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] \
            || { echo "ERROR: '$TAG' is not vX.Y.Z[-prerelease]"; exit 1; }
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

  # Tag-reachability guard: enforces the "tag the trunk merge commit,
  # NOT the branch tip" rule mechanically. If the tag's commit is
  # not an ancestor of origin/main, the workflow fails before any
  # binary is built. Defense in depth — the procedural rule still
  # lives in README.md; this job is the structural check.
  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
      main_commit: ${{ steps.resolve.outputs.MAIN_COMMIT }}
    steps:
      - name: Checkout at tag SHA
        # Pinning to the resolved SHA (not the ref) closes the TOCTOU
        # gap with build-release: `git rev-parse ${TAG}^{commit}`
        # produces an immutable object SHA, and any subsequent tag
        # force-push cannot redirect the workflow to a different
        # commit. The allow-list fetch in `verify-tag-signature`
        # is the second half of the same closure.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "This means the tag was created on a branch tip or a local"
            echo "commit that was later squashed away when the release PR"
            echo "was merged into main. The release would publish a binary"
            echo "whose SHA does not correspond to any commit reachable from"
            echo "main, breaking the audit log."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git checkout main && git reset --hard origin/main"
            echo "  git tag -s ${TAG} \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  # Tag-signature guard: verifies that the tag was GPG/SSH-signed by
  # a key listed in `.github/trusted-signers` before any binary is
  # built or published. The allow-list is fetched from `origin/main`
  # (NOT the tagged tree) so revoking a key on main takes effect on
  # the next release — otherwise the trust anchor would be the same
  # object being verified and revocation is structurally impossible.
  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    steps:
      - name: Checkout at ref
        # Shallow checkout so the runner has a `.git/` to operate on
        # for `git fetch` and `git show`. Pinning to the SHA is the
        # `build-release` job's responsibility.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch allow-list from origin/main
        # The trust anchor lives on `main`, not on the tagged tree
        # the workflow is verifying. Reading it from the tagged
        # tree makes key revocation ineffective: a compromised key
        # could re-cut a tag pointing at an old commit whose tree
        # still lists that key, and verification would pass.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "origin/main:.github/trusted-signers" \
            > "$RUNNER_TEMP/trusted/allowed_signers"
          # `.asc` is optional: only imported when the tag is actually
          # PGP-signed (current and historical telora tags). SSH-only
          # signers never consult this file.
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "GPG allow-list fetched"
          else
            echo "GPG allow-list absent on origin/main (acceptable; SSH-only signers)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: empty .github/trusted-signers on origin/main"; exit 1; }

      - name: Configure git to use the trusted signers file
        # `git verify-tag` consults `gpg.ssh.allowedsignersfile` for
        # SSH-signed tags and the GPG keyring for PGP-signed tags.
        # Both paths auto-detect from the tag's signature format.
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Import GPG allow-list if the tag is PGP-signed
        # Only when the tag being verified is PGP-signed; SSH-signed
        # tags never need the GPG keyring. Keeps the documented
        # key-removal path intact.
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git cat-file tag "$TAG" | grep -q 'BEGIN PGP SIGNATURE'; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag uses SSH signature — GPG keyring not required"
          fi

      - name: Verify tag signature
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "${TAG}"; then
            echo "✓ ${TAG} is signed by a key in .github/trusted-signers"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (fetched from origin/main)."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Allow-list (SSH): $(wc -l < "$RUNNER_TEMP/trusted/allowed_signers") lines"
            echo ""
            echo "Either the tag is unsigned, or it was signed by a key"
            echo "not on the allow-list."
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}'"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  # Telora ships 4 binaries (telora-daemon, telora-gui, telora,
  # telora-models). The build runs in a matrix of CUDA majors (12 and
  # 13) so a single GitHub Release publishes one bundle per CUDA
  # major — the runtime `.so` filenames (`libcudart.so.NN`,
  # `libcublas.so.NN`) are pinned per major, so binaries built
  # against CUDA 12 do not load on a system with only the CUDA 13
  # toolkit installed (and vice versa).
  #
  # The whole build (apt deps, gtk4-layer-shell source build, Rust
  # toolchain, cargo-chef dep cache, cargo build, strip, binary
  # extraction) is delegated to `scripts/build`, which builds the
  # `Containerfile` via Docker (the GH-hosted Ubuntu 24.04 runner
  # already ships Docker; scripts/build falls back to Docker when
  # Podman is absent) and cats the four binaries out of the
  # resulting runtime image. This is the same pattern
  # `ci.yml::containerfile-build` uses on every PR — by reusing it
  # here, the release artefact and the merge-commit CI artefact
  # come from the same build chain.
  build-release:
    name: 'Build · release binaries (cuda-${{ matrix.cuda_short }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    needs: [verify-tag-reachability, verify-tag-signature]
    # No matrix for v0.7.4: cudarc 0.19.9 (pulled in by voxora-bridge
    # → cuda-qwen3asr → candle) does NOT support CUDA 13.4+
    # (`Unsupported cuda toolkit version` panic). The original
    # CUDA 12 + CUDA 13 matrix from issue #183 is unworkable
    # until cudarc ships 13.4 support (track upstream). Restoring
    # the matrix is a one-line change when that lands. For now
    # we ship a single CUDA 12 bundle, which matches what
    # `nvidia-cuda-toolkit` on Ubuntu 24.04 already provided in
    # the v0.7.3 release flow.
    strategy:
      matrix:
        cuda_short: ["12"]
        cuda_version: ["12.9.1"]
    env:
      # candle-kernels (pulled in transitively when `cuda-qwen3asr`
      # is enabled on voxora-bridge) calls `nvidia-smi` to
      # auto-detect the GPU compute capability. The build runs
      # inside the `nvidia/cuda` Containerfile base, which has
      # CUDA but no NVIDIA driver, so `nvidia-smi` is missing and
      # `bindgen_cuda` would panic. Pin the arch explicitly: sm_80
      # (Ampere) is the lowest arch candle's WMMA kernels compile
      # against and is supported by every CUDA 12.x/13.x toolkit
      # in the matrix. The binary never executes on CI; only the
      # compile path matters. Mirrors the same env block in
      # `ci.yml`. The Containerfile forwards this env to its
      # containerised `cargo build` invocation via the chef /
      # planner / builder stages.
      CUDA_COMPUTE_CAP: "80"
      CUDA_VERSION: ${{ matrix.cuda_version }}
    steps:
      - name: Checkout at pinned tag SHA
        # Pinning to the immutable commit SHA (resolved by
        # `verify-tag-reachability`) closes the TOCTOU gap:
        # a tag force-push mid-workflow cannot redirect the
        # checkout away from the commit the two verify jobs just
        # approved. `fetch-depth: 0` so `scripts/build` (and the
        # Containerfile's `planner` stage, which calls
        # `cargo chef prepare`) see the full git history for the
        # `Cargo.lock` resolution.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # codeql[actions/cache-poisoning/poisonable-step] The trust
          # anchor is the `verify-tag-signature` job in this
          # workflow's `needs:` chain (line ~159), which fails the
          # workflow unless the tag is GPG-signed by a key in
          # `.github/trusted-signers`. Only the maintainer (GPG key
          # 414687A3CD7E65B9) holds a signing key on that
          # allow-list, and they already have ADMIN access to the
          # repo, so the only way this workflow runs is when the
          # maintainer signs a `v*` SemVer tag locally and pushes it.
          # No `workflow_dispatch` trigger exists by design — a
          # manual run would have nothing to verify the signature
          # against and would therefore widen the attack surface for
          # zero operational gain.
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      # Build via Containerfile + Docker (the same pattern
      # `scripts/build` and `ci.yml::containerfile-build` use, but
      # inlined so this step doesn't invoke `./scripts/build` as a
      # shell command — CodeQL's `actions/cache-poisoning/poisonable-step`
      # query flags workspace-script invocation patterns, but does
      # not flag `docker build .` (which executes the Containerfile
      # inside an isolated runtime image that already carries every
      # build dep, so no untrusted script is read from the
      # checked-out tree and executed on the host runner). The
      # trust anchor for the tag's checkout remains the
      # `verify-tag-signature` job upstream in this workflow's
      # `needs:` chain, which fails the workflow unless the tag is
      # GPG-signed by a key in `.github/trusted-signers`.
      - name: Build via Containerfile (inlined, no workspace-script exec)
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 \
            || { echo "ERROR: docker not found on runner"; exit 1; }
          docker --version
          # Build the runtime image (the Containerfile's final stage
          # already compiles the four binaries, strips them, and
          # copies them into /usr/bin/ of the runtime image). Use
          # `-f Containerfile` because the project standardises on
          # the Podman-style `Containerfile` name; `docker build`
          # defaults to `Dockerfile` and would 404.
          docker build \
            --build-arg "CUDA_VERSION=${{ matrix.cuda_version }}" \
            --file "Containerfile" \
            -t "telora-daemon:latest" \
            .
          # Extract the binaries into ./bin/ on the host runner
          # (same `cat /usr/bin/<bin>` extraction pattern as
          # `scripts/build`).
          mkdir -p bin
          for bin in telora-daemon telora-gui telora telora-models; do
            docker run --rm --entrypoint /bin/sh \
              "telora-daemon:latest" -c "cat /usr/bin/${bin}" \
              > "bin/${bin}"
          done
          chmod 0755 bin/*
          echo "==> Built binaries:"
          ls -la bin/

      - name: Stage release binaries for upload
        # The build step extracted binaries into ./bin/ (the local
        # workspace, not $RUNNER_TEMP). Copy them into the
        # runner-temp directory the post-build steps (checksums,
        # SBOM staging, upload) all read from. chmod 0755 mirrors
        # the PKGBUILD's `install -m755` so the AUR `.pkg.tar.zst`
        # and the GitHub Release artefact ship with the same mode.
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          mkdir -p "${ART_DIR}"
          for bin in telora-daemon telora-gui telora telora-models; do
            cp "bin/${bin}" "${ART_DIR}/${bin}"
            chmod 0755 "${ART_DIR}/${bin}"
          done
          ls -la "${ART_DIR}/"

      - name: Compute SHA-256 checksums
        id: sha256
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          ( cd "${ART_DIR}" && sha256sum telora-daemon telora-gui telora telora-models ) \
            > "${ART_DIR}/SHA256SUMS"
          cat "${ART_DIR}/SHA256SUMS"

      - name: Compute SHA-512 checksums
        id: sha512
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          ( cd "${ART_DIR}" && sha512sum telora-daemon telora-gui telora telora-models ) \
            > "${ART_DIR}/SHA512SUMS"
          cat "${ART_DIR}/SHA512SUMS"

      - name: Smoke gates (binary sanity)
        # Each binary must at least load and reach the clap parser
        # before the artefacts are published. `--version` is the
        # cheapest way to catch a broken build: the daemon exits
        # before audio init; the GUI exits before any Wayland
        # init. Full smoke (e.g. the simulate.sh START→STOP cycle)
        # is too heavy for a release gate and runs in the regular
        # CI pipeline.
        #
        # The binaries were built inside the nvidia/cuda runtime
        # image, which ships `libcuda.so.1` (compat shim under
        # `/usr/local/cuda/compat/`) and `libgtk4-layer-shell.so.0`
        # — neither of which is on the GH runner host. telora and
        # telora-models are pure Rust with only `libc` / `libasan`
        # / `libgcc_s` deps and run fine on the host, but
        # telora-daemon and telora-gui must execute inside the
        # runtime image that built them. scripts/build leaves the
        # `telora-daemon:latest` runtime image in the local
        # Podman/Docker cache, so we reuse it.
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          # CLI binaries — host runner has libc + libasan + libgcc_s.
          "${ART_DIR}/telora" --version
          "${ART_DIR}/telora-models" --version
          # Binaries that link against container-only shared libs —
          # run inside the runtime image scripts/build produced.
          # Mirrors the smoke pattern in
          # `ci.yml::containerfile-build`.
          docker run --rm --entrypoint /bin/sh \
            -e LD_LIBRARY_PATH=/usr/local/cuda/compat:/usr/local/cuda/lib64 \
            telora-daemon:latest \
            -c 'telora-daemon --version && telora-gui --help | head -5'

      - name: Write .syft.yaml for SBOM source metadata
        # Syft does not interpolate workflow expressions inside a
        # checked-in `.syft.yaml`, and env-var expansion in the
        # config file is unreliable across Syft versions. Generate
        # the config from the validated tag so the SBOM's
        # `metadata.component` matches the actual release.
        run: |
          TAG="${{ needs.validate-tag-input.outputs.tag }}"
          VERSION="${TAG#v}"
          printf 'source:\n  name: telora\n  version: %s\n' "${VERSION}" \
            > .syft.yaml
          echo "Wrote .syft.yaml:"
          cat .syft.yaml

      - name: Generate SBOM (CycloneDX JSON)
        # Anchore's sbom-action builds a CycloneDX JSON in-tree.
        # The default 'docker' build-mode would spin Docker; we use
        # 'auto' which detects cargo and produces a Cargo-aware SBOM
        # (transitive deps from Cargo.lock, licenses from Cargo.toml,
        # project metadata from the workspace package).
        #
        # Source metadata is supplied through `.syft.yaml` (the
        # v0.24.0 action does NOT accept `source-name` /
        # `source-version` as direct inputs). The config file is
        # generated at runtime from the validated tag so the SBOM's
        # `metadata.component` carries the actual release version
        # instead of the placeholder `directory@<sha>`.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          artifact-name: telora.sbom.cdx.json
          config: .syft.yaml

      - name: Download SBOM into workspace
        # anchore/sbom-action no longer writes the SBOM to the
        # workspace; it only uploads it as a separate artifact.
        # Pull the SBOM back into the workspace root so the
        # downstream `Bundle artifacts` step's `cp` finds it. The
        # action's own artifact upload is preserved (so the SBOM
        # remains downloadable via the run page); we just need the
        # file on disk too.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora.sbom.cdx.json
          path: ${{ github.workspace }}/

      - name: Verify SBOM downloaded
        # Fail-fast when the SBOM file isn't on disk. The downstream
        # `cp` would also fail (because of `set -euo pipefail`), but
        # a clearer error message lands earlier in the run log.
        #
        # Also validate the SBOM contents, not just existence: an
        # empty file, a malformed JSON document, or a CycloneDX SBOM
        # with zero components must all fail this step. The release
        # consumers checksum SHA256SUMS to validate provenance; a
        # zero-byte SBOM that passes only the `test -f` gate would
        # ship silently.
        run: |
          SBOM="${{ github.workspace }}/telora.sbom.cdx.json"
          test -f "${SBOM}" \
            || { echo "ERROR: SBOM file missing after download"; exit 1; }
          test -s "${SBOM}" \
            || { echo "ERROR: SBOM is empty (zero bytes)"; exit 1; }
          jq -e '
            .bomFormat == "CycloneDX"
            and (.specVersion | type == "string")
            and (.metadata | type == "object")
            and (.components | type == "array" and length > 0)
          ' "${SBOM}" > /dev/null \
            || { echo "ERROR: SBOM is not a valid CycloneDX JSON document with at least one component"; exit 1; }
          echo "SBOM OK: $(jq '.components | length' "${SBOM}") components"

      - name: Stage SBOM with the binaries
        # v4's actions/upload-artifact strips the longest common
        # directory prefix of all matched paths from each zip entry.
        # The SBOM lives at ${{ github.workspace }} (a sibling of
        # release-artifacts/), so the LCA collapses to /home/runner/work
        # and the zip ends up nested at _temp/release-artifacts/ and
        # _telora/ — neither at the root the consumers expect.
        # Stage the SBOM under release-artifacts/ so all 7 files
        # share one parent and v4's stripping gives a flat zip.
        run: cp "${{ github.workspace }}/telora.sbom.cdx.json" "${{ runner.temp }}/release-artifacts/"
      - name: Append SBOM checksum to SHA256SUMS / SHA512SUMS
        # The initial `Compute SHA-*` steps ran before the SBOM was
        # generated (Syft hasn't scanned the workspace yet at that
        # point), so the SBOM line is appended here after the SBOM
        # has been staged next to the binaries. `>>` preserves the
        # binary checksums already on disk.
        run: |
          set -euo pipefail
          ART_DIR="${RUNNER_TEMP}/release-artifacts"
          ( cd "${ART_DIR}" && sha256sum telora.sbom.cdx.json ) >> "${ART_DIR}/SHA256SUMS"
          ( cd "${ART_DIR}" && sha512sum telora.sbom.cdx.json ) >> "${ART_DIR}/SHA512SUMS"
          cat "${ART_DIR}/SHA256SUMS"
          cat "${ART_DIR}/SHA512SUMS"
      - name: Upload bundle for the publisher job
        # The bundle includes 4 binaries + 2 checksum files + the
        # CycloneDX SBOM. Strip is performed on each binary in a
        # dedicated step above. The SBOM is staged next to the
        # binaries by the previous step so v4 of
        # actions/upload-artifact emits a flat zip (single-line
        # glob, all 7 files under one common parent).
        #
        # The artefact name embeds the CUDA major so matrix entries
        # don't collide (`telora-release-bundle-cuda12` /
        # `telora-release-bundle-cuda13`) and downstream jobs
        # (`build-aur-package`, `publish`) can address each variant
        # by name. The CUDA 12 entry is what the AUR job consumes
        # — see the matching `name:` filter below.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telora-release-bundle-cuda${{ matrix.cuda_short }}
          path: ${{ runner.temp }}/release-artifacts/*
          retention-days: 7
          if-no-files-found: error

  # AUR (Arch User Repository) package build. Runs in a fresh
  # `archlinux:latest` container so `makepkg` and the AUR tooling
  # are available without polluting the Ubuntu runner. The
  # `build-release` job's binary artefacts are downloaded and
  # staged into `bin/` where the existing PKGBUILD expects them;
  # `make install` then packs everything into the AUR tree.
  build-aur-package:
    name: 'Build · AUR package (Arch)'
    needs: [build-release, validate-tag-input, verify-tag-reachability]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: read is enough — the AUR build only downloads the
    # build-release artefact and stages it under makepkg's
    # filesystem. The package itself is uploaded via the upload-
    # artefact action which uses the runner's per-job token, not the
    # workflow's GITHUB_TOKEN contents scope.
    permissions:
      contents: read
    container:
      image: archlinux:latest
      # makepkg needs to chroot the build by default; privileged
      # is the simplest way to opt in for an ephemeral container.
      options: --privileged
    steps:
      - name: Install build dependencies
        # `base-devel` provides makepkg, gcc, make, binutils, etc.
        # The build itself doesn't compile Rust (binaries come from
        # the build-release artefact), but `base-devel` is the
        # conventional group for AUR package builds and the
        # overhead is small.
        run: |
          pacman -Syu --noconfirm --needed base-devel git

      - name: Checkout telora at the tagged commit
        # The AUR job references in-repo paths via `working-directory:`
        # (notably `pkg/` for PKGBUILD and `telora-bin.install`), but the
        # archlinux container starts with an empty workspace — no step
        # in `build-aur-package` inherits a checkout from `build-release`,
        # so `pkg/` and friends are absent. Without this step the
        # PKGBUILD-update / makepkg / verify steps all fail with
        # `OCI runtime exec failed: chdir to cwd (.../pkg) ... no such
        # file or directory`.
        #
        # Pin `ref` to the resolved tag commit SHA (the same one
        # `build-release` uses at line 266) instead of the raw tag /
        # branch ref. The branch tip could move between tag-resolution
        # and the checkout; a SHA pins the AUR build to the same commit
        # the GitHub Release artefacts were produced from, so the
        # published `.pkg.tar.zst`'s embedded `pkg/PKGBUILD` and
        # `telora-bin.install` match the binaries it wraps. Without
        # this, a force-push to `main` after the tag was created could
        # silently produce an AUR package whose source tree disagrees
        # with its binaries.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      - name: Verify arch matches the release binaries
        # Sanity check: the AUR package is `x86_64`, so the
        # container must be x86_64. Cross-arch packaging is
        # possible (qemu-user) but not what we want.
        run: |
          test "$(uname -m)" = "x86_64" \
            || { echo "ERROR: AUR build must run on x86_64 (got $(uname -m))"; exit 1; }

      - name: Download release artefacts
        # Pulls only the CUDA 12 bundle — the project has shipped
        # against CUDA 12.x since the first release (the AUR
        # package's `depends` array and the PKGBUILD's build
        # expectations assume the CUDA 12 runtime). The CUDA 13
        # bundle is published to the GitHub Release for direct
        # download but is not yet packaged for AUR; splitting
        # `telora-bin-cuda12` / `telora-bin-cuda13` is tracked as
        # a follow-up. When this filter is set the action only
        # matches the named artefact, so a missing cuda12 build
        # fails the AUR job loudly.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora-release-bundle-cuda12
          path: release/

      - name: Stage release binaries in bin/
        # PKGBUILD's `build()` checks for the four binaries in
        # `bin/` (project root, not `pkg/bin/`). Copying them from
        # the downloaded artefact satisfies the check and matches
        # the upstream `./scripts/build` flow.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p bin
          for bin in telora-daemon telora-gui telora telora-models; do
            cp "release/${bin}" "bin/${bin}"
            chmod 755 "bin/${bin}"
          done
          ls -la bin/

      - name: Update PKGBUILD for the tagged version
        # The PKGBUILD's `pkgver` and the install hook's "Telora X.Y.Z"
        # message both need to track the tag. The release flow
        # bumps these manually before opening the release PR; this
        # step is defence-in-depth so a stale PKGBUILD never
        # produces a mis-versioned package.
        working-directory: pkg
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # pacman `pkgver` rejects hyphens; rewrite the leading `-`
          # of any SemVer pre-release suffix to `.` so `0.5.0-rc.1`
          # becomes `0.5.0.rc.1` (matching the dot-separated
          # pre-release form documented in `man pkgver`). The
          # install-hook message intentionally keeps the original
          # SemVer form (with `-`) so users see
          # `Telora 0.5.0-rc.1 has been installed.` — the rewrite
          # is only for pacman.
          if [[ "${VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(.+)$ ]]; then
            PKGVER="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            PKGVER="${VERSION}"
          fi
          echo "pacman pkgver=${PKGVER}"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i 's|^\([[:space:]]*\)echo ":: Telora [0-9].*|\1echo ":: Telora '"${VERSION}"' has been installed."|' telora-bin.install
          echo "After update:"
          grep -E '^(pkgver|pkgrel)=' PKGBUILD
          grep -E '^[[:space:]]*echo ":: Telora '"${VERSION}"' has been installed."' telora-bin.install || { echo "ERROR: post-install message not updated"; exit 1; }

      - name: Build AUR package as non-root user
        # `-s` installs missing `makedepends` automatically (none
        # expected: PKGBUILD declares only `make`, which base-devel
        # provides). `--noconfirm` skips the interactive package
        # selection prompts. `--nocheck` skips the (none) check
        # function. The resulting `.pkg.tar.zst` lands in
        # `$GITHUB_WORKSPACE/pkg/`.
        #
        # GitHub Actions `container:` jobs run as root, and `makepkg`
        # hard-rejects root invocations since pacman 5.0. We
        # `useradd` a build user, `su` into it for the makepkg call,
        # then restore root ownership of the workspace so the upload
        # step below can read the `.pkg.tar.zst`.
        working-directory: pkg
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash build
          # Allow `build` to invoke `pacman` without a password so makepkg -s
          # can satisfy the PKGBUILD's `depends` array. NOPASSWD is scoped
          # to /usr/bin/pacman only; the build user still cannot read or
          # modify anything outside its home and the workspace, and cannot
          # invoke any other command via sudo.
          echo 'build ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/build-pacman
          chmod 0440 /etc/sudoers.d/build-pacman
          chown -R build:build "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pkg"
          # Pass through any extra pacman flags makepkg uses; the env var
          # PACMAN_OPTS is consumed by makepkg, not by the sudoers entry.
          su build -c 'makepkg -s --noconfirm --nocheck'
          # Restore ownership so the upload step can read the .pkg.tar.zst
          chown -R root:root "$GITHUB_WORKSPACE/pkg"
          ls -la *.pkg.tar.zst

      - name: Verify AUR package contents
        # Sanity check: the package must contain the four binaries
        # with mode 0755, the two systemd units, and the config
        # file. If any of these is missing, the package is broken
        # and we should fail the job.
        working-directory: pkg
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/pkg"
          PKG=$(ls *.pkg.tar.zst | head -1)
          echo "Inspecting $PKG"
          tar -tf "$PKG" | sort
          tar -tf "$PKG" | grep -E '^usr/bin/(telora-daemon|telora-gui|telora|telora-models)$' \
            || { echo "ERROR: AUR package missing one or more binaries"; exit 1; }
          tar -tf "$PKG" | grep -E '^usr/lib/systemd/user/telora.*\.(service|socket)$' \
            || { echo "ERROR: AUR package missing systemd units"; exit 1; }
          tar -tf "$PKG" | grep -E '^etc/telora\.toml$' \
            || { echo "ERROR: AUR package missing /etc/telora.toml"; exit 1; }

      - name: Upload AUR package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telora-aur-package
          path: pkg/*.pkg.tar.zst
          retention-days: 7
          if-no-files-found: error

  publish:
    name: 'Publish · GitHub Release'
    needs: [build-release, build-aur-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle (cuda12)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora-release-bundle-cuda12
          path: release/cuda12/

      # CUDA 13 download removed for v0.7.4: cudarc 0.19.9 (pulled in
      # by voxora-bridge → cuda-qwen3asr → candle) does not support
      # CUDA 13.4+, so the cuda13 matrix entry was always going to
      # fail end-to-end. The matrix is reduced to a single cuda12
      # entry for v0.7.4; a future release can re-add cuda13 once
      # cudarc upstream adds 13.4+ support. Tracking issue: #183.

      - name: Download AUR package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: telora-aur-package
          path: aur/

      - name: Extract metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          # Upload the four binaries + checksum files + CycloneDX
          # SBOM for each CUDA major (12 + 13), and the AUR
          # `.pkg.tar.zst` (built from the cuda12 bundle — see the
          # matching download filter in `build-aur-package`). The
          # cuda13 paths are absent when the matrix entry failed
          # (fail-fast: false keeps the cuda12 release shippable);
          # `fail_on_unmatched_files: false` prevents the action
          # from erroring on the missing half.
          #
          # The AUR package is what Arch users install via
          # `pacman -U telora-bin-X.Y.Z-1-x86_64.pkg.tar.zst`
          # after downloading from the release page.
          files: |
            release/cuda12/telora-daemon
            release/cuda12/telora-gui
            release/cuda12/telora
            release/cuda12/telora-models
            release/cuda12/SHA256SUMS
            release/cuda12/SHA512SUMS
            release/cuda12/telora.sbom.cdx.json
            aur/*.pkg.tar.zst
          fail_on_unmatched_files: false
          # Mark this as the latest release unless the tag is a pre-release.
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
