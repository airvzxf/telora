# Telora configuration.
#
# The daemon loads this file at startup. Fields can be overridden
# with environment variables prefixed with `TELORA_` (e.g.
# `TELORA_LANGUAGE=fr`) or with CLI flags
# (`telora-daemon --language fr`).

# Engine family. One of:
#   "whisper"    — whisper.cpp via voxora-whisper (ggml-*.bin files)
#   "qwen3-asr"  — Qwen3-ASR via voxora-qwen3asr (candle, multi-lingual)
#   "minimax"    — MiniMax hosted STT API via voxora-minimax (closes
#                  #163; compute is server-side; the bearer token
#                  lives in `~/.config/telora/.env`, NEVER here).
model_kind = "whisper"

# Hugging Face model identifier (or local path, see below).
#
# The daemon calls voxora-bridge which calls voxora-hf to resolve
# this id, downloading (if needed) and caching the weights into
# `$XDG_CACHE_HOME/voxora/models/huggingface`. Switch engines by
# editing this field and `model_kind`; no code changes required.
#
# A few examples:
#   ggerganov/whisper.cpp/ggml-base.bin   — Whisper base (English-ish)
#   ggerganov/whisper.cpp/ggml-large-v3.bin
#   Qwen/Qwen3-ASR-0.6B                   — Qwen3-ASR (20 languages)
#   Qwen/Qwen3-ASR-1.7B                   — Qwen3-ASR (larger, 20 languages)
#   asr-1.0                               — MiniMax hosted model
#                                          (closes #165; voxora's
#                                          default is `asr-1.0`,
#                                          which the daemon logs
#                                          and surfaces when you
#                                          leave this field blank)
#
# To use a model cache outside the default XDG location, pass
# `--voxora-cache DIR` to the daemon or set `VOXORA_CACHE_DIR=DIR`.
# The CLI value takes precedence over the environment value. Absolute
# overrides must be under `$XDG_CACHE_HOME`; invalid overrides fall back
# to `$XDG_CACHE_HOME/voxora/models/huggingface`.
model_id = "ggerganov/whisper.cpp/ggml-base.bin"

# Legacy field: kept so old telora.toml files keep working.
# The daemon reads `model_id` (above) and falls back to this if
# `model_id` is empty. New configs should set `model_id` directly.
model_path = ""

# Bearer tokens for hosted engines NEVER live here (closes
# #166). The MiniMax API key is read at startup from
# `~/.config/telora/.env` (mode 0600 expected), then
# `/etc/telora/.env`, then `VOXORA_MINIMAX_API_KEY`, then
# `MINIMAX_API_KEY`. Override the file path with the CLI flag
# `--minimax-env-file PATH` for CI runners and one-off dev
# shells. See the README "MiniMax hosted STT" section for the
# systemd drop-in recipe.

# Language code (ISO 639-1, e.g. "es", "en", "fr"). The daemon
# translates this to the engine-specific vocabulary internally:
#   - whisper: passed through as-is.
#   - qwen3-asr: mapped to the full English name
#     (`english`, `chinese`, `cantonese`, …).
language = "es"

# Maximum recording time in seconds.
# The daemon will automatically stop and process the audio if this
# limit is reached. Default is 600 seconds (10 minutes). Set to a
# higher value for long dictations, or lower to prevent memory abuse.
max_recording_seconds = 300

# Socket and runtime paths.
#
# If all fields are left empty (the default), the daemon resolves:
#   socket_dir      = $XDG_RUNTIME_DIR/telora
#   daemon_socket   = socket_dir / "daemon.sock"
#   control_socket  = socket_dir / "control.sock"
# If $XDG_RUNTIME_DIR is unset or not writable, falls back to
#   /run/user/<uid>/telora  →  /tmp/telora-<uid>/  (last resort)
#
# Any non-empty field wins over the default. In a systemd user service,
# the flat canonical variables below take precedence over these legacy fields:
#   TELORA_DAEMON_SOCKET
#   TELORA_CONTROL_SOCKET
# For config-file/env cascading outside systemd, use:
#   TELORA_PATHS__SOCKET_DIR
#   TELORA_PATHS__DAEMON_SOCKET
#   TELORA_PATHS__CONTROL_SOCKET
[paths]
socket_dir      = ""
daemon_socket   = ""
control_socket  = ""

# Audio input device selection.
#
# The daemon captures microphone audio through `cpal`, whose default
# host on Linux is ALSA. ALSA's `default` PCM on hosts running
# PipeWire / PulseAudio (KDE Plasma 6, GNOME, etc.) routes through
# the PipeWire ALSA plugin to whatever source the desktop has
# selected — so on a machine where the operator chose the Fifine USB
# mic in Plasma's audio settings, the default already captures from
# the Fifine and there is nothing to override.
#
# `input_device` (empty by default) lets the operator pin a specific
# capture device when the system default points at the wrong one.
# The match is a case-insensitive substring against the cpal device
# name as reported by the ALSA host, e.g.:
#
#   input_device = "sysdefault:CARD=Microphone"   # direct ALSA, exact card
#   input_device = "front:CARD=Microphone,DEV=0"
#   input_device = "Fifine"                       # any device whose name mentions Fifine
#
# When `input_device` is empty and the system default is named
# `"default"` (the typical PipeWire / PulseAudio ALSA plugin
# situation), `prefer_direct_alsa` controls the legacy auto-fallback:
#
#   *  `prefer_direct_alsa = false` (default): honour the system
#      default. The daemon captures from whatever KDE / PipeWire
#      selected — usually the right thing.
#
#   *  `prefer_direct_alsa = true`: switch to the first ALSA device
#      whose name contains `"CARD="`, bypassing the plugin. Useful on
#      hosts where the plugin lies about supported formats (older
#      PipeWire versions, exotic USB mics). The previous behaviour of
#      telora <= 0.7.2.
#
# The matching `TELORA_AUDIO__INPUT_DEVICE` /
# `TELORA_AUDIO__PREFER_DIRECT_ALSA` env vars follow the same
# `TELORA_*__SECTION__KEY` shape as `[paths]`.
[audio]
input_device        = ""
prefer_direct_alsa  = false
