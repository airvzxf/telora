[package]
name = "telora-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gtk4 = "0.10"
gtk4-layer-shell = { version = "0.7", features = ["v1_3"] }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
async-channel = "2.2"
toml = "0.8"
wl-clipboard-rs = "0.9"
telora-common = { workspace = true }
# `fs` feature gates `nix::sys::stat::umask`; the bind helper in
# `telora-common` uses it for atomic mode-0o600 socket creation
# (mirroring `telora-daemon`'s pattern). The feature set is the
# minimum needed for that one call.
nix = { version = "0.27", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tokio = { version = "1.36", features = ["full", "test-util"] }
