[package]
name = "telora-gui"
version.workspace = true
edition.workspace = true

[dependencies]
gtk4 = "0.10"
gtk4-layer-shell = { version = "0.7", features = ["v1_3"] }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
async-channel = "2.2"
toml = "0.8"
wl-clipboard-rs = "0.9"
# `fs` feature gates `nix::sys::stat::umask`, used by
# `ControlServer::bind` to make the `bind(2)` create the socket with
# mode 0o600 atomically (mirroring `telora-daemon`'s pattern). The
# feature set is the minimum needed for that one call; we do not pull
# in `signal`/`user` because the GUI never uses those.
nix = { version = "0.27", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tokio = { version = "1.36", features = ["full", "test-util"] }
