[package]
name = "telora-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gtk4 = "0.10"
gtk4-layer-shell = { version = "0.7", features = ["v1_3"] }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
async-channel = "2.2"
toml = "0.8"
# `config` 0.13 mirrors the daemon's four-tier config cascade in
# `telora-gui/src/paths::load_paths_config` (EPIC #134 / #64). The
# `TOML` file format only — YAML / JSON / INI are out of scope
# for the operator-facing config surface.
config = { version = "0.13", default-features = false, features = ["toml"] }
wl-clipboard-rs = "0.9"
# `ksni` 0.3 implements the freedesktop StatusNotifierItem (SNI)
# specification over DBus in pure Rust. Used by `telora-gui` to expose
# a system-tray icon (closes #193): KDE Plasma 6 (Wayland), GNOME,
# Cinnamon, LXQt and any other SNI-compliant watcher recognise it.
# We pin to the `tokio` feature (default) because `telora-gui` already
# runs a multi-threaded `tokio::Runtime` in a worker thread — sharing
# the same runtime avoids spinning a second executor. No GLib binding
# needed; ksni talks directly to `org.kde.StatusNotifierWatcher` on
# the session bus.
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
telora-common = { workspace = true }

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tokio = { version = "1.36", features = ["full", "test-util"] }
