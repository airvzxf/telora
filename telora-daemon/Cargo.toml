[package]
name = "telora-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# voxora-bridge 0.6 replaces the direct whisper-rs dependency.
# voxora-bridge defaults to `["whisper", "qwen3asr"]`, which is
# exactly what the daemon needs so users can switch model_kind
# without a rebuild. voxora-bridge 0.6 also re-exports
# `voxora_traits::*`, so the trait surface used by the daemon
# (`AsrEngine`, `EngineFamily`, `ModelSource`, `ResolveOptions`,
# `AsrError`, `ModelDir`) is reachable via `voxora_bridge::*`
# without pulling the deprecated `voxora-core` shim.
#
# `cuda-whisper` enables ggml-cuda for whisper.cpp (Pascal sm_50+ OK).
# `cuda-qwen3asr` enables candle's CUDA path for qwen3-asr (sm_70+ / Volta
# or newer — candle's WMMA kernels need Volta). On older hardware the
# qwen3-asr engine falls back to CPU at runtime; the binary keeps both
# backends compiled in so Volta+ users get GPU acceleration out of the
# box without editing the manifest.
#
# `minimax` (closes #163) re-exports `voxora-minimax 0.6.1`, the
# first hosted-API engine adapter in the voxora workspace (closes
# airvzxf/voxora#157 / EPIC #153). With this feature enabled the
# daemon's `BridgeTranscriber::from_id` arm for `EngineFamily::MiniMax`
# becomes reachable: an operator can set `model_kind = "minimax"` in
# `telora.toml` and have the daemon POST captured audio to the
# MiniMax `/v1/speech_to_text` endpoint using a bearer token
# resolved via `MINIMAX_API_KEY` / `VOXORA_MINIMAX_API_KEY` /
# `telora.toml`'s optional `minimax_api_key` field. There is no
# GPU backend for MiniMax (compute happens server-side) and no
# `cuda-minimax` forward — operators on low-end hardware that
# cannot run Whisper / Qwen3-ASR locally now have an opt-in
# hosted-API off-ramp.
voxora-bridge = { workspace = true, features = ["cuda-whisper", "cuda-qwen3asr", "minimax"] }
# `cudarc` is the CUDA driver binding candle-core uses under the
# `cuda` feature. Pulled in transitively today; we re-list it here
# directly so `transcriber::pick_qwen3asr_device` can call
# `cudarc::driver::CudaDevice::compute_capability()` at startup
# and force CPU when the local GPU is below candle's WMMA floor
# (sm_70). Without this direct dep, candle-core's choice of cudarc
# version is hidden behind a transitive pin and we would either
# have to round-trip through candle's public API (which doesn't
# expose compute_capability) or shell out to `nvidia-smi`. Version
# pinned to whatever candle-core 0.9.2 currently uses; bump
# alongside candle-core in the voxora-bump PR.
cudarc = "0.19"
# voxora-registry 0.6.x owns the canonical resolution path
# (`Registry::resolve(&ModelId::parse(id), &opts) -> ResolvedModel`)
# the daemon goes through so it never has to lex-sort `*.bin`
# files in a cache directory. Direct dep (not pulled transitively
# through the bridge) because the bridge is a pure re-exporter
# and won't expose the registry surface.
voxora-registry = { workspace = true }

cpal = "0.15"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
log = "0.4"
telora-common = { workspace = true }
# The shared cache resolver lives in telora-common; keep the daemon focused
# on its runtime and model-loading responsibilities.
env_logger = "0.11"
hound = "3.5"
socket2 = "0.5"
nix = { version = "0.27", features = ["fs", "signal", "user"] }
rubato = "0.14"
ringbuf = "0.3"
clap = { version = "4.4", features = ["derive"] }
config = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `sd_notify` is required by `Type=notify` in the systemd unit; the
# daemon signals readiness only after `SocketServer::bind` succeeds,
# closing the startup-race window that `Type=simple` allowed.
# `libsystemd` is already a workspace dep via `telora-common` (used
# for FD inheritance); the daemon only needs the `daemon` module
# for `notify(READY=1)`.
libsystemd = { workspace = true }

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tokio = { version = "1.36", features = ["full", "test-util"] }
# The voxora_020_resolution regression test exercises the registry
# path (`ModelId::parse` + `Registry::resolve`) against a fabricated
# cache layout. Production code already pulls `voxora-registry`
# transitively via the bridge, but we list it here explicitly so the
# test can import `RegistryHfExt` / `ModelId` without a private
# re-export dance.
voxora-registry = { workspace = true }
# Closes #163 (MiniMax integration): the `minimax_live_jfk`
# integration test below posts a JFK inaugural clip to the real
# MiniMax `/v1/speech_to_text` endpoint and asserts the recognised
# text. `voxora-minimax` is opt-in via the bridge's `minimax`
# Cargo feature (re-exported as `voxora_bridge::MiniMaxEngine` for
# production code); we list it as a direct dev-dependency so the
# test compiles even when a slim consumer strips the bridge
# features down to `whisper` only. The `[[test]]` entry below
# re-gates compilation on the `minimax` feature so a slim build
# does not pull `voxora-minimax` into the test target either.
voxora-minimax = { workspace = true }

# Closes #163: live end-to-end smoke for the MiniMax engine.
# The single `#[test]` inside is `#[ignore]`-gated so it does not
# run in `cargo test --workspace`; it requires `MINIMAX_API_KEY`
# and posts a ~30 s JFK inaugural WAV to the real endpoint. Run
# with:
#
#   MINIMAX_API_KEY=<key> \
#     cargo test -p telora-daemon --test minimax_live_jfk \
#       -- --ignored --nocapture
#
# We intentionally do NOT use `required-features = ["minimax"]`
# (the voxora-bridge `cross_engine_parity` pattern) because the
# daemon already enables `voxora-bridge/minimax` unconditionally
# in the production `[dependencies]` line above; the `#[ignore]`
# annotation is the real gate that keeps the live round-trip out
# of `cargo test --workspace`.
[[test]]
name = "minimax_live_jfk"
