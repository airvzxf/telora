[package]
name = "telora-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# voxora-bridge 0.4 replaces the direct whisper-rs dependency.
# voxora-bridge defaults to `["whisper", "qwen3asr"]`, which is
# exactly what the daemon needs so users can switch model_kind
# without a rebuild. voxora-bridge 0.4 also re-exports
# `voxora_traits::*`, so the trait surface used by the daemon
# (`AsrEngine`, `EngineFamily`, `ModelSource`, `ResolveOptions`,
# `AsrError`, `ModelDir`) is reachable via `voxora_bridge::*`
# without pulling the deprecated `voxora-core` shim.
#
# `cuda-whisper` enables ggml-cuda for whisper.cpp (Pascal sm_61+ OK).
# We deliberately leave `cuda-qwen3asr` off: candle's WMMA kernels
# require sm_70+ (Volta), so the qwen3-asr backend stays on CPU on
# Pascal and older. Bump to `cuda` (umbrella) on sm_70+ hardware.
voxora-bridge = { workspace = true, features = ["cuda-whisper"] }
# voxora-registry 0.4 owns the canonical resolution path
# (`Registry::resolve(&ModelId::parse(id), &opts) -> ResolvedModel`)
# the daemon goes through so it never has to lex-sort `*.bin`
# files in a cache directory. Direct dep (not pulled transitively
# through the bridge) because the bridge is a pure re-exporter
# and won't expose the registry surface.
voxora-registry = { workspace = true }

cpal = "0.15"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
log = "0.4"
telora-common = { workspace = true }
# The shared cache resolver lives in telora-common; keep the daemon focused
# on its runtime and model-loading responsibilities.
env_logger = "0.11"
hound = "3.5"
socket2 = "0.5"
nix = { version = "0.27", features = ["fs", "signal", "user"] }
rubato = "0.14"
ringbuf = "0.3"
clap = { version = "4.4", features = ["derive"] }
config = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `sd_notify` is required by `Type=notify` in the systemd unit; the
# daemon signals readiness only after `SocketServer::bind` succeeds,
# closing the startup-race window that `Type=simple` allowed.
# `libsystemd` is already a workspace dep via `telora-common` (used
# for FD inheritance); the daemon only needs the `daemon` module
# for `notify(READY=1)`.
libsystemd = { workspace = true }

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tokio = { version = "1.36", features = ["full", "test-util"] }
# The voxora_020_resolution regression test exercises the registry
# path (`ModelId::parse` + `Registry::resolve`) against a fabricated
# cache layout. Production code already pulls `voxora-registry`
# transitively via the bridge, but we list it here explicitly so the
# test can import `RegistryHfExt` / `ModelId` without a private
# re-export dance.
voxora-registry = { workspace = true }
