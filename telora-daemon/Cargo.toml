[package]
name = "telora-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
# voxora-bridge replaces the direct whisper-rs dependency. voxora-bridge
# defaults to `["whisper", "qwen3asr"]`, which is exactly what the
# daemon needs so users can switch model_kind without a rebuild.
#
# `cuda-whisper` enables ggml-cuda for whisper.cpp (Pascal sm_61+ OK).
# We deliberately leave `cuda-qwen3asr` off: candle's WMMA kernels
# require sm_70+ (Volta), so the qwen3-asr backend stays on CPU on
# Pascal and older. Bump to `cuda` (umbrella) on sm_70+ hardware.
voxora-bridge = { workspace = true, features = ["cuda-whisper"] }

cpal = "0.15"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
log = "0.4"
env_logger = "0.11"
hound = "3.5"
socket2 = "0.5"
nix = { version = "0.27", features = ["fs", "signal", "user"] }
rubato = "0.14"
ringbuf = "0.3"
clap = { version = "4.4", features = ["derive"] }
config = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tokio = { version = "1.36", features = ["full", "test-util"] }
