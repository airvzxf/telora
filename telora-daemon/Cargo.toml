[package]
name = "telora-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# GPU backends are on by default so release builds (CI, Containerfile,
# AUR) keep shipping CUDA binaries. For a CPU-only build on a host
# without a cudarc-supported CUDA toolkit:
#   cargo build -p telora-daemon --no-default-features
default = ["cuda"]
cuda = ["cuda-whisper", "cuda-qwen3asr"]
# ggml-cuda for whisper.cpp (Pascal sm_50+).
cuda-whisper = ["voxora-bridge/cuda-whisper"]
# candle CUDA for qwen3-asr (needs sm_70+; older GPUs fall back to CPU
# at runtime). `cudarc` is used directly to probe compute capability.
cuda-qwen3asr = ["voxora-bridge/cuda-qwen3asr", "dep:cudarc"]

[dependencies]
# Default bridge features (whisper + qwen3asr) plus the hosted MiniMax engine.
voxora-bridge = { workspace = true, features = ["minimax"] }
cudarc = { version = "0.19", optional = true }
# voxora-registry 0.6.x owns the canonical resolution path
# (`Registry::resolve(&ModelId::parse(id), &opts) -> ResolvedModel`)
# the daemon goes through so it never has to lex-sort `*.bin`
# files in a cache directory. Direct dep (not pulled transitively
# through the bridge) because the bridge is a pure re-exporter
# and won't expose the registry surface.
voxora-registry = { workspace = true }

cpal = "0.15"
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
log = "0.4"
telora-common = { workspace = true }
# The shared cache resolver lives in telora-common; keep the daemon focused
# on its runtime and model-loading responsibilities.
env_logger = "0.11"
hound = "3.5"
socket2 = "0.5"
nix = { version = "0.27", features = ["fs", "signal", "user"] }
rubato = "0.14"
ringbuf = "0.3"
clap = { version = "4.4", features = ["derive"] }
config = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `sd_notify` is required by `Type=notify` in the systemd unit; the
# daemon signals readiness only after `SocketServer::bind` succeeds,
# closing the startup-race window that `Type=simple` allowed.
# `libsystemd` is already a workspace dep via `telora-common` (used
# for FD inheritance); the daemon only needs the `daemon` module
# for `notify(READY=1)`.
libsystemd = { workspace = true }

[dev-dependencies]
tempfile = "3"
assert_fs = "1"
tokio = { version = "1.36", features = ["full", "test-util"] }
# The voxora_020_resolution regression test exercises the registry
# path (`ModelId::parse` + `Registry::resolve`) against a fabricated
# cache layout. Production code already pulls `voxora-registry`
# transitively via the bridge, but we list it here explicitly so the
# test can import `RegistryHfExt` / `ModelId` without a private
# re-export dance.
voxora-registry = { workspace = true }
# Closes #163 (MiniMax integration): the `minimax_live_jfk`
# integration test below posts a JFK inaugural clip to the real
# MiniMax `/v1/speech_to_text` endpoint and asserts the recognised
# text. `voxora-minimax` is opt-in via the bridge's `minimax`
# Cargo feature (re-exported as `voxora_bridge::MiniMaxEngine` for
# production code); we list it as a direct dev-dependency so the
# test compiles even when a slim consumer strips the bridge
# features down to `whisper` only. The `[[test]]` entry below
# re-gates compilation on the `minimax` feature so a slim build
# does not pull `voxora-minimax` into the test target either.
voxora-minimax = { workspace = true }

# Closes #163: live end-to-end smoke for the MiniMax engine.
# The single `#[test]` inside is `#[ignore]`-gated so it does not
# run in `cargo test --workspace`; it requires `MINIMAX_API_KEY`
# and posts a ~30 s JFK inaugural WAV to the real endpoint. Run
# with:
#
#   MINIMAX_API_KEY=<key> \
#     cargo test -p telora-daemon --test minimax_live_jfk \
#       -- --ignored --nocapture
#
# We intentionally do NOT use `required-features = ["minimax"]`
# (the voxora-bridge `cross_engine_parity` pattern) because the
# daemon already enables `voxora-bridge/minimax` unconditionally
# in the production `[dependencies]` line above; the `#[ignore]`
# annotation is the real gate that keeps the live round-trip out
# of `cargo test --workspace`.
[[test]]
name = "minimax_live_jfk"
